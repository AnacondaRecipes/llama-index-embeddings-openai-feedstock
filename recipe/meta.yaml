{% set name = "llama-index-embeddings-openai" %}
{% set version = "0.5.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  - url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/llama_index_embeddings_openai-{{ version }}.tar.gz
    sha256: 1c89867a48b0d0daa3d2d44f5e76b394b2b2ef9935932daf921b9e77939ccda8
  # https://github.com/run-llama/llama_index/issues/10806
  - url: https://raw.githubusercontent.com/run-llama/llama_index/main/LICENSE
    sha256: 24f40b5190fdacabc24ddbb5f76364d15e4f030925220ea300d8a2dd4993c8cb

build:
  number: 0
  skip: true  # [py<310]
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python
    - hatchling
    - pip
  run:
    - python
    - openai >=1.1.0
    - llama-index-core >=0.13.0,<0.15

test:
  imports:
    - llama_index.embeddings.openai
  commands:
    - pip check
  requires:
    - pip

about:
  home: https://llamaindex.ai
  summary: llama-index embeddings openai integration
  description: |
    LlamaIndex embeddings integration with OpenAI. Provides the OpenAIEmbedding
    class for generating text embeddings using OpenAI models such as
    text-embedding-3-large and text-embedding-3-small.
  license: MIT
  license_file: LICENSE
  license_family: MIT
  doc_url: https://developers.llamaindex.ai/python/examples/embeddings/openai/
  dev_url: https://github.com/run-llama/llama_index/tree/main/llama-index-integrations/embeddings/llama-index-embeddings-openai

extra:
  recipe-maintainers:
    - jan-janssen
    - pavelzw
